<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nakliye Fiyat & Onay Yönetimi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --navy:#0f2942; --navy-2:#14365a; --navy-3:#1d4d7e;
  --gold:#c9a227; --gold-2:#e0bd47; --gold-soft:#f6edcf;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f7f9fb;
  --line:#dde3ea; --line-2:#e9edf2;
  --text:#15212e; --muted:#5f6f80; --faint:#8a98a8;
  --green:#1f8a52; --green-bg:#e4f3ea;
  --red:#c0392b; --red-bg:#fbe9e7;
  --amber:#b9821a; --amber-bg:#fbf1da;
  --blue:#2563a8; --blue-bg:#e6eef7;
  --radius:10px; --radius-s:7px;
  --shadow:0 1px 2px rgba(15,41,66,.06),0 4px 16px rgba(15,41,66,.07);
  --shadow-lg:0 8px 40px rgba(15,41,66,.16);
  --ff:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
[data-theme="dark"]{
  --navy:#0c1c2e; --navy-2:#102a44; --navy-3:#1b4470;
  --bg:#0a1622; --surface:#122436; --surface-2:#0f1f2f;
  --line:#1f3850; --line-2:#1a3047;
  --text:#e4ebf2; --muted:#9fb1c2; --faint:#6c8094;
  --gold:#d4af37; --gold-2:#e6c659; --gold-soft:#2a2616;
  --green:#3fb377; --green-bg:#10361f;
  --red:#e57368; --red-bg:#3a1714;
  --amber:#dba93f; --amber-bg:#352709;
  --blue:#5a9bdb; --blue-bg:#102539;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--navy-3);text-decoration:none}
::selection{background:var(--gold);color:var(--navy)}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--navy);color:#dce6f0;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:40;transition:transform .25s}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{display:flex;align-items:center;gap:11px}
.brand .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(201,162,39,.3)}
.brand .name{font-weight:700;font-size:15px;color:#fff;letter-spacing:.2px}
.brand .sub{font-size:11px;color:#8aa3bd;margin-top:1px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:#6f8aa6;padding:12px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#bcd0e4;font-weight:500;margin-bottom:2px;transition:.13s;position:relative;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--navy-3);color:#fff}
.nav a.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--gold);border-radius:0 3px 3px 0}
.nav a .ico{width:18px;height:18px;flex-shrink:0;opacity:.9}
.nav a .badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:8px}
.side-foot button{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#cfe0f0;padding:8px;border-radius:7px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.13s}
.side-foot button:hover{background:rgba(255,255,255,.14)}

.main{flex:1;margin-left:236px;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.topbar .crumb{font-size:12.5px;color:var(--muted);margin-top:1px}
.topbar .spacer{flex:1}
.search-box{position:relative}
.search-box input{width:240px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--text);outline:none;transition:.15s}
.search-box input:focus{border-color:var(--navy-3);background:var(--surface);box-shadow:0 0 0 3px rgba(29,77,126,.12)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.menu-toggle{display:none;background:none;border:none;color:var(--text)}
.content{padding:24px 26px 60px;max-width:1600px;width:100%}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--navy-3);background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold-2)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{filter:brightness(1.08)}
.btn.danger{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== Cards & grid ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-12px;top:-12px;width:60px;height:60px;border-radius:50%;opacity:.07}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat .d{font-size:12px;color:var(--faint);margin-top:3px}
.stat.s1 .v{color:var(--navy-3)} .stat.s1::after{background:var(--navy-3)}
.stat.s2 .v{color:var(--amber)} .stat.s2::after{background:var(--amber)}
.stat.s3 .v{color:var(--green)} .stat.s3::after{background:var(--green)}
.stat.s4 .v{color:var(--gold)} .stat.s4::after{background:var(--gold)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-head h2{font-size:15px;font-weight:700}
.panel-head .spacer{flex:1}
.panel-body{padding:18px}
.panel-body.flush{padding:0}

/* ===== Tables ===== */
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:.1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.t-row-click{cursor:pointer}
.cell-strong{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted);margin-top:1px}

/* ===== Badges ===== */
.badge-s{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge-s::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-toplama{background:var(--blue-bg);color:var(--blue)}
.b-onayda{background:var(--amber-bg);color:var(--amber)}
.b-onaylandi{background:var(--green-bg);color:var(--green)}
.b-reddedildi{background:var(--red-bg);color:var(--red)}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* ===== Forms / Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(10,22,34,.55);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;animation:pop .2s}
.modal.wide{max-width:1080px}
.modal.xwide{max-width:1240px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h3{font-size:17px;font-weight:700}
.modal-head .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-head .x:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:22px;max-height:calc(100vh - 150px);overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--text);outline:none;transition:.14s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-3);background:var(--surface);box-shadow:0 0 0 3px rgba(29,77,126,.12)}
.field textarea{resize:vertical;min-height:64px}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:5px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.section-divider{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);font-weight:700;margin:20px 0 12px;padding-bottom:7px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:8px}

/* ===== Carrier cards ===== */
.firm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}
.firm-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:.15s}
.firm-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.firm-card .fc-head{padding:14px 16px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;display:flex;align-items:center;gap:11px}
.firm-card .fc-avatar{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold);font-size:15px;flex-shrink:0}
.firm-card .fc-name{font-weight:700;font-size:15px}
.firm-card .fc-meta{font-size:12px;color:#9fb8d0;margin-top:1px}
.firm-card .fc-body{padding:14px 18px}
.fc-line{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);padding:4px 0}
.fc-line svg{flex-shrink:0;color:var(--faint)}
.fc-emp{margin-top:10px;padding-top:12px;border-top:1px solid var(--line-2)}
.fc-emp-item{display:flex;align-items:center;gap:9px;padding:7px 0}
.fc-emp-item .ea{width:28px;height:28px;border-radius:7px;background:var(--gold-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.fc-emp-item .en{font-weight:600;font-size:13px}
.fc-emp-item .et{font-size:11.5px;color:var(--faint)}
.fc-foot{padding:11px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;background:var(--surface-2)}
.fc-stat{display:flex;flex-direction:column}
.fc-stat .num{font-weight:800;font-size:16px;color:var(--navy-3)}
.fc-stat .lbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}

/* ===== Quote comparison ===== */
.quote-card{border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;transition:.15s;position:relative}
.quote-card.best{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.quote-card.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.qc-ribbon{position:absolute;top:0;right:0;padding:3px 12px;font-size:10.5px;font-weight:700;letter-spacing:.4px;border-radius:0 0 0 8px}
.qc-ribbon.best{background:var(--green);color:#fff}
.qc-ribbon.sel{background:var(--gold);color:var(--navy)}
.qc-head{padding:13px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2)}
.qc-avatar{width:34px;height:34px;border-radius:8px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.qc-price{padding:14px 15px}
.qc-price .amount{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--navy-3)}
.quote-card.best .qc-price .amount{color:var(--green)}
.qc-price .unit-price{font-size:12.5px;color:var(--muted);margin-top:2px}
.qc-meta{padding:0 15px 13px;display:flex;flex-wrap:wrap;gap:6px}
.qc-actions{padding:11px 15px;border-top:1px solid var(--line-2);display:flex;gap:8px;background:var(--surface-2)}

/* ===== Detail layout ===== */
.detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.info-row{display:flex;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.info-row:last-child{border-bottom:none}
.info-row .il{width:140px;color:var(--muted);flex-shrink:0;font-weight:500}
.info-row .iv{font-weight:600}
.route-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.route-box .pin{display:flex;flex-direction:column;align-items:center}
.route-box .pin .dot{width:11px;height:11px;border-radius:50%;border:3px solid var(--navy-3)}
.route-box .pin .line{width:2px;height:26px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.route-box .pin .dot.end{border-color:var(--gold);background:var(--gold)}
.route-box .places{flex:1}
.route-box .place{font-weight:700;font-size:15px}
.route-box .place-l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.route-box .place:first-child{margin-bottom:14px}

/* timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 0}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.tl-item.done::before{border-color:var(--green);background:var(--green)}
.tl-item.active::before{border-color:var(--gold);background:var(--gold)}
.tl-item.reject::before{border-color:var(--red);background:var(--red)}
.tl-t{font-weight:600;font-size:13.5px}
.tl-d{font-size:12px;color:var(--muted);margin-top:1px}

/* file upload */
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);transition:.15s;cursor:pointer}
.dropzone:hover{border-color:var(--navy-3);background:var(--surface-2)}
.dropzone svg{color:var(--faint);margin-bottom:8px}
.file-chip{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--green-bg);border:1px solid var(--green);border-radius:8px;margin-top:10px}
.file-chip .fi{width:34px;height:34px;border-radius:7px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-chip .fn{font-weight:600;font-size:13px}
.file-chip .fs{font-size:11.5px;color:var(--muted)}

/* empty */
.empty{text-align:center;padding:54px 20px;color:var(--muted)}
.empty svg{color:var(--line);margin-bottom:14px}
.empty h3{font-size:16px;color:var(--text);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:380px;margin:0 auto 18px}

/* toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--navy);color:#fff;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:500;animation:slideIn .25s;min-width:260px}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* emp builder rows */
.emp-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.emp-row input{padding:8px 10px}
.emp-row .del{background:var(--red-bg);border:1px solid var(--red);color:var(--red);width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.chip-filter{padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);transition:.13s}
.chip-filter:hover{border-color:var(--navy-3)}
.chip-filter.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip-filter .c{display:inline-block;margin-left:5px;opacity:.7;font-size:11px}

/* print report */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;padding:0}
  .no-print{display:none !important}
  .report-sheet.wideform{max-width:none !important;width:100% !important;padding:0 !important;font-size:10px}
  .report-sheet.wideform h1{font-size:17px}
  .report-sheet table.grid{table-layout:fixed;width:100%}
  .report-sheet table.grid th{font-size:8.5px !important;padding:3px 3px !important;word-break:break-word;white-space:normal !important;line-height:1.1}
  .report-sheet table.grid td{font-size:8.5px !important;padding:2px 3px !important;word-break:break-word}
  .report-sheet table.grid td span,.report-sheet table.grid td b{white-space:normal !important}
}
.report-sheet{background:#fff;color:#15212e;padding:42px 48px;max-width:820px;margin:0 auto;font-size:13px}
.report-sheet .rh{display:flex;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:18px;margin-bottom:22px}
.report-sheet .rh .rmark{width:54px;height:54px;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin-right:16px}
.report-sheet h1{font-size:21px;color:var(--navy);margin-bottom:2px}
.report-sheet .rh .meta{font-size:12px;color:#5f6f80}
.report-sheet .rno{margin-left:auto;text-align:right;font-size:12px;color:#5f6f80}
.report-sheet .rno b{display:block;font-size:15px;color:var(--navy)}
.report-sheet h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);border-bottom:1px solid #dde3ea;padding-bottom:6px;margin:22px 0 12px}
.report-sheet table{margin-bottom:8px}
.report-sheet th{background:var(--navy);color:#fff;font-size:11px;padding:9px 11px}
.report-sheet td{padding:9px 11px;border-bottom:1px solid #e9edf2;font-size:12.5px}
.report-sheet tr.rec td{background:#e4f3ea;font-weight:600}
/* excel-benzeri geniş onay formu */
.report-sheet.wideform{max-width:1180px;padding:34px 36px}
.report-sheet table.grid{width:100%;border-collapse:collapse;margin-bottom:8px}
.report-sheet table.grid th{background:var(--navy);color:#fff;font-size:10px;padding:6px 7px;border:1px solid #24486e;text-align:center;vertical-align:bottom}
.report-sheet table.grid td{padding:5px 7px;border:1px solid #c5d0db;font-size:11px;vertical-align:middle}
.report-sheet table.grid tfoot td{border:1px solid #24486e}
@page landscapePage{size:A4 landscape;margin:10mm}
.report-sheet.landscape{page:landscapePage}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px;margin-bottom:8px}
.report-grid .rg{display:flex;font-size:12.5px;padding:5px 0;border-bottom:1px solid #eef1f5}
.report-grid .rg b{width:130px;color:#5f6f80;font-weight:500}
.sign-area{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}
.sign-box{text-align:center}
.sign-box .sl{border-top:1.5px solid #15212e;padding-top:8px;font-size:12px;color:#5f6f80;margin-top:64px}
.sign-box .sn{font-weight:700;font-size:13px;color:var(--navy)}
.report-foot{margin-top:34px;padding-top:14px;border-top:1px solid #dde3ea;font-size:10.5px;color:#8a98a8;text-align:center}

/* map */
.map-wrap{height:600px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
#mapMain{height:100%;width:100%}
.map-modal{height:230px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px;position:relative}
.map-modal .lk{height:100%;width:100%}
.map-modal .hint-overlay{position:absolute;top:8px;left:8px;z-index:500;background:var(--navy);color:#fff;font-size:11px;padding:4px 9px;border-radius:6px;opacity:.9;pointer-events:none}
.leaflet-container{font-family:var(--ff);background:var(--surface-2)}
.map-legend{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap;font-size:13px;align-items:center}
.map-legend .lg{display:flex;align-items:center;gap:7px;color:var(--muted)}
.map-legend .pin-d{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}
.coord-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.dist-box{margin-bottom:16px;padding:13px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.dist-box .dv{font-size:19px;font-weight:800;color:var(--navy-3);line-height:1.1}
.dist-box .dl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
@media(max-width:980px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .menu-toggle{display:flex}
  .search-box input{width:150px}
  .content{padding:18px 14px 50px}
  .stat-grid{grid-template-columns:1fr 1fr;gap:12px}
  .grid-2{grid-template-columns:1fr}
  .emp-row{grid-template-columns:1fr 1fr;gap:6px}
}
</style>

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(LS_KEY);if(r){DB=Object.assign(DB,JSON.parse(r))}}catch(e){console.warn(e)}}

function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- helpers ---------- */
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return(n==null||isNaN(n))?'—':Number(n).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2})}
function fmtTon(n){if(n==null||n===''||isNaN(n))return '—';let s=String(+n);return s.replace('.',',')}
function tonNum(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n}
function tonInput(el){el.value=el.value.replace(/[^\d,]/g,'').replace(/(,[^,]*),/g,'$1')}
function money(n,p){return PARA[p||'TRY']+fmt(n)}
function dt(s){if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function dtt(s){if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function initials(s){return(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function telFmt(v){let d=(v||'').replace(/\D/g,'');if(d.startsWith('90'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);d=d.slice(0,10);if(!d.length)return'';let o='+90 '+d.slice(0,3);if(d.length>3)o+=' '+d.slice(3,6);if(d.length>6)o+=' '+d.slice(6,8);if(d.length>8)o+=' '+d.slice(8,10);return o}
const TEL_PH='+90 5XX XXX XX XX';

/* ---------- coğrafi yardımcılar ---------- */
const OLC_A='23456789CFGHJMPQRVWX';
function decodePlusCode(code){
  if(!code)return null;code=String(code).toUpperCase().replace(/[^0-9A-Z+]/g,'');
  if(code.indexOf('+')<0)return null;let clean='';for(const ch of code){if(ch==='+'||ch==='0')continue;clean+=ch}
  if(clean.length<8)return null;for(const ch of clean){if(OLC_A.indexOf(ch)<0)return null}
  let lat=-90,lng=-180,res=20;const dg=Math.min(clean.length,10);
  for(let i=0;i+1<dg;i+=2){lat+=OLC_A.indexOf(clean[i])*res;lng+=OLC_A.indexOf(clean[i+1])*res;res/=20}
  let rLat=res*20,rLng=res*20;
  if(clean.length>10){let a=rLat,b=rLng;for(let i=10;i<Math.min(clean.length,15);i++){a/=5;b/=4;const d=OLC_A.indexOf(clean[i]);lat+=Math.floor(d/4)*a;lng+=(d%4)*b}rLat=a;rLng=b}
  return{lat:lat+rLat/2,lng:lng+rLng/2};
}
function parseKonum(s){
  if(!s)return null;s=String(s).trim();
  let m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  const p=decodePlusCode(s);if(p)return p;
  m=s.match(/(-?\d{1,2}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  m=s.match(/^\s*(-?\d{1,2}),(\d+)\s*[, ]\s*(-?\d{1,3}),(\d+)\s*$/);
  if(m)return{lat:+(m[1]+'.'+m[2]),lng:+(m[3]+'.'+m[4])};
  return null;
}
function haversine(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const s=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
async function fetchJson(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||8000);try{const r=await fetch(url,{signal:c.signal});clearTimeout(t);if(!r.ok)return null;return await r.json()}catch(e){clearTimeout(t);return null}}
async function geocode(q){
  if(!q)return null;
  let j=await fetchJson('https://photon.komoot.io/api/?limit=1&lang=tr&bbox=25.6,35.8,44.9,42.3&q='+encodeURIComponent(q));
  if(j&&j.features&&j.features[0]&&j.features[0].geometry){const c=j.features[0].geometry.coordinates;return{lat:+c[1],lng:+c[0]}}
  j=await fetchJson('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tr&accept-language=tr&q='+encodeURIComponent(q));
  if(j&&j[0])return{lat:+j[0].lat,lng:+j[0].lon};
  return null;
}
async function osrmShortest(a,b){const j=await fetchJson(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false&alternatives=3`,9000);if(!j||j.code!=='Ok'||!j.routes||!j.routes.length)return null;return Math.min(...j.routes.map(x=>x.distance))/1000}
function lokById(id){return DB.lokasyonlar.find(l=>l.id===id)}
function hasCoord(l){return l&&typeof l.lat==='number'&&typeof l.lng==='number'}
function toTRY(amount,cur){if(cur==='TRY')return amount;if(cur==='USD')return amount*(DB.kur.USD||1);if(cur==='EUR')return amount*(DB.kur.EUR||1);return amount}
function firmName(id){const f=DB.firmalar.find(x=>x.id===id);return f?f.ad:'(silinmiş firma)'}
function lokName(id){const l=DB.lokasyonlar.find(x=>x.id===id);return l?l.ad:''}
function defaultTeslimId(){const f=DB.lokasyonlar.find(l=>l.fabrika);return f?f.id:(DB.lokasyonlar[0]?DB.lokasyonlar[0].id:'')}
function locOptions(sel){return DB.lokasyonlar.map(l=>`<option value="${l.id}" ${l.id===sel?'selected':''}>${esc(l.ad)}${l.sehir?' — '+esc(l.sehir):''}${l.fabrika?' (Fabrika)':''}</option>`).join('')}
function lokasyonStats(locId){const ts=[...DB.talepler.filter(t=>t.yuklemeLokasyonId===locId)].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));const prices=[];ts.forEach(t=>{const q=t.teklifler.find(q=>q.id===t.secilenTeklifId)||t.teklifler.find(q=>q.id===bestQuoteId(t));if(q)prices.push(toTRY(q.fiyat,q.paraBirimi))});return{sefer:ts.length,fiyatli:prices.length,avg:prices.length?prices.reduce((a,b)=>a+b,0)/prices.length:0,min:prices.length?Math.min(...prices):0,max:prices.length?Math.max(...prices):0,son:prices.length?prices[prices.length-1]:0}}
function statusBadge(d){const m={toplama:['b-toplama','Fiyat toplanıyor'],onayda:['b-onayda','Onay bekliyor'],onaylandi:['b-onaylandi','Onaylandı'],reddedildi:['b-reddedildi','Reddedildi']};const x=m[d]||m.toplama;return `<span class="badge-s ${x[0]}">${x[1]}</span>`}

/* normalize a quote to TRY per base unit for fair comparison */
const YUK_TIPLERI=['Mısır','Mısır Özü','Ayçekirdeği','Soya'];
function qTotal(q,t){return toTRY(q.fiyat,q.paraBirimi)*(Number(t.miktar)||0)}
function selectedQuote(t){return t.teklifler.find(x=>x.id===t.secilenTeklifId)||null}
function gerceklesenBirim(t){const q=selectedQuote(t);if(!q)return null;if(t.gerceklesen&&t.gerceklesen.birimFiyat!=null&&isFinite(+t.gerceklesen.birimFiyat))return{firmaId:q.firmaId,birimFiyat:+t.gerceklesen.birimFiyat,paraBirimi:t.gerceklesen.paraBirimi||q.paraBirimi,indirimli:true,orijinal:q.fiyat,orijinalPara:q.paraBirimi};return{firmaId:q.firmaId,birimFiyat:q.fiyat,paraBirimi:q.paraBirimi,indirimli:false,orijinal:q.fiyat,orijinalPara:q.paraBirimi}}
function gercTotalTRY(t){const g=gerceklesenBirim(t);return g?toTRY(g.birimFiyat,g.paraBirimi)*(Number(t.miktar)||0):0}
function indirimYuzde(t){const g=gerceklesenBirim(t);if(!g||!g.indirimli)return null;const o=toTRY(g.orijinal,g.orijinalPara),y=toTRY(g.birimFiyat,g.paraBirimi);if(!o)return null;return (o-y)/o*100}
function lokasyonStatsByProduct(locId){
  const m={};
  [...DB.talepler.filter(t=>t.yuklemeLokasyonId===locId)].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)).forEach(t=>{
    const k=(t.yukTipi||'Diğer').trim()||'Diğer';if(!m[k])m[k]={prices:[],sefer:0,son:0};m[k].sefer++;
    let v=null;
    if(t.secilenTeklifId){const g=gerceklesenBirim(t);if(g)v=toTRY(g.birimFiyat,g.paraBirimi)}
    else{const q=t.teklifler.find(q=>q.id===bestQuoteId(t));if(q)v=toTRY(q.fiyat,q.paraBirimi)}
    if(v!=null){m[k].prices.push(v);m[k].son=v}
  });
  return Object.keys(m).map(k=>({urun:k,sefer:m[k].sefer,fiyatli:m[k].prices.length,avg:m[k].prices.length?m[k].prices.reduce((a,b)=>a+b,0)/m[k].prices.length:0,son:m[k].son})).sort((a,b)=>b.sefer-a.sefer);
}
function findAnlasmalar(yukId,tesId,urun){const out=[];DB.firmalar.forEach(f=>(f.anlasmalar||[]).forEach(a=>{if(a.yuklemeLokasyonId===yukId&&a.teslimLokasyonId===tesId&&(!a.yukTipi||!urun||a.yukTipi===urun)&&a.birimFiyat!=null&&a.birimFiyat!=='')out.push({firma:f,anlasma:a})}));return out}
function sonIslem(yukId,tesId,exId){const ts=DB.talepler.filter(t=>t.id!==exId&&t.yuklemeLokasyonId===yukId&&t.teslimLokasyonId===tesId&&t.secilenTeklifId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));if(!ts.length)return null;const t=ts[0];const g=gerceklesenBirim(t);return g?{firmaId:g.firmaId,birimFiyat:g.birimFiyat,paraBirimi:g.paraBirimi,tarih:t.createdAt,durum:t.durum,yukTipi:t.yukTipi,indirimli:g.indirimli}:null}
function firmaSonFiyat(firmaId,yukId,tesId,exId){let best=null;DB.talepler.forEach(t=>{if(t.id===exId)return;if(t.yuklemeLokasyonId!==yukId||t.teslimLokasyonId!==tesId)return;t.teklifler.filter(q=>q.firmaId===firmaId).forEach(q=>{let bf=q.fiyat,bp=q.paraBirimi,ind=false;if(t.secilenTeklifId===q.id&&t.gerceklesen&&t.gerceklesen.birimFiyat!=null){bf=+t.gerceklesen.birimFiyat;bp=t.gerceklesen.paraBirimi||q.paraBirimi;ind=true}if(!best||new Date(q.createdAt)>new Date(best.tarih))best={birimFiyat:bf,paraBirimi:bp,tarih:q.createdAt,indirimli:ind}})});return best}
function bestQuoteId(talep){let best=null,min=Infinity;talep.teklifler.forEach(q=>{const v=toTRY(q.fiyat,q.paraBirimi);if(v<min){min=v;best=q.id}});return best}

    <div class="stat s4"><div class="k">Sağlanan Tasarruf</div><div class="v" style="font-size:23px">${money(tasarruf,'TRY')}</div><div class="d">en yüksek tekliflere göre</div></div>

  <div class="panel">
    <div class="panel-head"><h2>Onay bekleyenler</h2><div class="spacer"></div>${bekleyen.length?`<button class="btn sm" onclick="go('onaylar')">Onay Merkezi →</button>`:''}</div>
    <div class="panel-body flush">

      ${bekleyen.map(x=>{const q=x.teklifler.find(q=>q.id===x.secilenTeklifId)||x.teklifler.find(q=>q.id===bestQuoteId(x));return `<tr class="t-row-click" onclick="go('detail','${x.id}')">
        <td class="cell-strong">${esc(x.talepNo)}</td>
        <td>${esc(x.yuklemeNoktasi)} → ${esc(x.teslimNoktasi)}</td>
        <td>${q?esc(firmName(q.firmaId)):'—'}</td>
        <td class="cell-strong">${q?money(qTotal(q,x),'TRY'):'—'}</td>
        <td>${dt(x.createdAt)}</td>
        <td><button class="btn sm primary" onclick="event.stopPropagation();openOnayModal('${x.id}')">İncele & Onayla</button></td></tr>`}).join('')}
      </tbody></table>`:`<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><h3>Onay sırası boş</h3><p>Fiyatları topladıktan sonra talebi onaya gönderdiğinizde burada listelenir.</p></div>`}
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Son talepler</h2><div class="spacer"></div><button class="btn sm" onclick="go('talepler')">Tümü →</button></div>

      ${son.map(x=>{const b=bestQuoteId(x);const bq=x.teklifler.find(q=>q.id===b);return `<tr class="t-row-click" onclick="go('detail','${x.id}')">

function updateTalepBar(){const n=talepSelCount();const bar=document.getElementById('talepBar');if(bar)bar.style.display=n?'flex':'none';const c=document.getElementById('talepSelCount');if(c)c.textContent=n;const all=document.getElementById('talepAll');if(all){const tot=visibleTalepler().filter(t=>t.durum==='toplama').length;all.checked=n>0&&n>=tot&&tot>0}}
function bulkSendToApproval(){
  const sendable=[],noQuote=[];
  [...talepSel].forEach(id=>{const t=DB.talepler.find(x=>x.id===id);if(!t||t.durum!=='toplama')return;if(t.teklifler.length>0)sendable.push(t);else noQuote.push(t)});
  if(!sendable.length){toast(noQuote.length?'Seçilen taleplerde teklif yok — önce teklif ekleyin':'Onaya gönderilecek uygun talep yok','err');return}
  const msg=`${sendable.length} talep onaya gönderilecek.`+(noQuote.length?` ${noQuote.length} talepte teklif olmadığından atlanacak.`:'')+`\nSeçili teklifi olmayan taleplerde en uygun (en düşük) teklif otomatik önerilecek. Devam edilsin mi?`;
  if(!confirm(msg))return;
  let n=0;sendable.forEach(t=>{if(!t.secilenTeklifId)t.secilenTeklifId=bestQuoteId(t);t.durum='onayda';t.onay=Object.assign({},t.onay,{gonderim:new Date().toISOString()});n++});

}

          ${x.durum==='toplama'?`<button class="btn sm gold" style="margin-left:auto" onclick="teklifAnlasmadan('${x.id}','${a.firma.id}',${a.anlasma.birimFiyat},'${a.anlasma.paraBirimi}')">Bu fiyatı teklif olarak ekle</button>`:''}
        </div>`).join(''):''}
        ${son?`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;color:var(--muted)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/></svg>
          Bu hatta önceki işlem: <b style="color:var(--text)">${esc(firmName(son.firmaId))}</b> · <b style="color:var(--text)">${money(son.birimFiyat,son.paraBirimi)}/${esc(x.birim||'ton')}</b> <span style="color:var(--faint)">(${dt(son.tarih)})</span>
        </div>`:''}
      </div></div>`:''}

      <div class="panel">
        <div class="panel-head"><h2>Teklifler (${x.teklifler.length})</h2><div class="spacer"></div>
          ${x.durum==='toplama'?`<button class="btn sm primary" onclick="openTeklifModal('${x.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Teklif Ekle</button>`:''}
        </div>
        <div class="panel-body">
          ${x.teklifler.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px">
          ${sortedQ.map(q=>{const isBest=q.id===best;const isSel=q.id===x.secilenTeklifId;return `
            <div class="quote-card ${isBest?'best':''} ${isSel?'selected':''}">
              ${isSel?'<div class="qc-ribbon sel">SEÇİLDİ</div>':(isBest?'<div class="qc-ribbon best">EN UYGUN</div>':'')}

              <div class="qc-price"><div class="amount">${money(q.fiyat,q.paraBirimi)}<span style="font-size:13px;font-weight:500;color:var(--muted)">/${esc(x.birim||'ton')}</span></div>
                <div class="unit-price">${x.miktar?'Toplam: <b style="color:var(--text)">'+money(qTotal(q,x),'TRY')+'</b> ('+fmtTon(x.miktar)+' '+esc(x.birim)+')':(q.paraBirimi!=='TRY'?'≈ '+money(toTRY(q.fiyat,q.paraBirimi),'TRY')+'/'+esc(x.birim||'ton'):'')}</div></div>
              <div class="qc-meta">
                ${q.kdvDahil?'<span class="tag">KDV dahil</span>':'<span class="tag">KDV hariç</span>'}

                ${q.gecerlilik?`<span class="tag">Geçerlilik: ${dt(q.gecerlilik)}</span>`:''}

            ${x.miktar?`<div><span style="color:var(--muted)">En uyguna göre tasarruf:</span> <b style="color:var(--green)">${money((Math.max(...x.teklifler.map(q=>toTRY(q.fiyat,q.paraBirimi)))-Math.min(...x.teklifler.map(q=>toTRY(q.fiyat,q.paraBirimi))))*(Number(x.miktar)||0),'TRY')}</b></div>`:''}
          </div>`:''}
          ${x.secilenTeklifId?(()=>{const g=gerceklesenBirim(x);const sq=selectedQuote(x);const ind=indirimYuzde(x);return `
          <div style="margin-top:16px;padding:14px 16px;border:1px solid ${g.indirimli?'var(--green)':'var(--line)'};border-radius:10px;background:${g.indirimli?'rgba(34,160,90,.07)':'var(--surface-2)'}">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="font-weight:700;font-size:13.5px">İndirim / Gerçekleşen Fiyat</div><div style="flex:1"></div>
              <button class="btn sm ${g.indirimli?'':'primary'}" onclick="openIndirimModal('${x.id}')">${g.indirimli?'Düzenle':'Fiyat Gir'}</button>${g.indirimli?`<button class="btn sm ghost" style="color:var(--red)" onclick="indirimSil('${x.id}')">Kaldır</button>`:''}</div>
            ${g.indirimli?`<div style="margin-top:11px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">

              <div><div style="font-size:11px;color:var(--faint)">Gerçekleşen (indirimli)</div><div style="font-size:18px;font-weight:800;color:var(--green)">${money(g.birimFiyat,g.paraBirimi)}/${esc(x.birim||'ton')}</div></div>
              ${x.miktar?`<div><div style="font-size:11px;color:var(--faint)">İndirimli Toplam</div><div style="font-size:15px;font-weight:800">${money(gercTotalTRY(x),'TRY')}</div></div>`:''}
              ${ind!=null?`<div><div style="font-size:11px;color:var(--faint)">İndirim</div><div style="font-weight:700;color:var(--green)">▼ ${ind.toFixed(1)}%</div></div>`:''}
              ${x.gerceklesen&&x.gerceklesen.not?`<div style="flex-basis:100%;font-size:12px;color:var(--muted);font-style:italic;margin-top:2px">${esc(x.gerceklesen.not)}</div>`:''}
            </div>
            <div style="margin-top:9px;font-size:11.5px;color:var(--faint)">Bu fiyat raporlarda indirimli tutar olarak görünür ve bu hattın bir sonraki "önceki fiyatı" olarak baz alınır.</div>`
            :`<div style="margin-top:8px;font-size:12.5px;color:var(--muted)">Firma görüşme sonrası indirim yaptıysa gerçekleşen birim fiyatı girin — raporda indirimli tutar olarak çıkar ve bu hattın bir sonraki "önceki fiyatı" olur.</div>`}
          </div>`})():''}
          `:`<div class="empty" style="padding:30px"><h3>Henüz teklif girilmedi</h3><p>3-4 farklı nakliyeciden aldığınız fiyatları tek tek ekleyin; sistem en uygun olanı otomatik işaretler.</p>${x.durum==='toplama'?`<button class="btn primary" onclick="openTeklifModal('${x.id}')">+ İlk Teklifi Ekle</button>`:''}</div>`}
        </div>
      </div>
    </div>

    <div>
      <div class="panel"><div class="panel-head"><h2>Talep bilgileri</h2></div><div class="panel-body">
        <div class="info-row"><div class="il">Talep no</div><div class="iv">${esc(x.talepNo)}</div></div>
        <div class="info-row"><div class="il">Yük tipi</div><div class="iv">${esc(x.yukTipi||'—')}</div></div>
        <div class="info-row"><div class="il">Miktar</div><div class="iv">${x.miktar?fmtTon(x.miktar)+' '+esc(x.birim):'—'}</div></div>
        <div class="info-row"><div class="il">Araç tipi</div><div class="iv">${esc(x.aracTipi||'—')}</div></div>
        <div class="info-row"><div class="il">Yükleme tarihi</div><div class="iv">${dt(x.yuklemeTarihi)}</div></div>
        <div class="info-row"><div class="il">Oluşturulma</div><div class="iv">${dtt(x.createdAt)}</div></div>
        ${x.aciklama?`<div class="info-row" style="flex-direction:column;align-items:flex-start"><div class="il">Açıklama</div><div class="iv" style="font-weight:400;margin-top:4px">${esc(x.aciklama)}</div></div>`:''}
      </div></div>

      <div class="panel"><div class="panel-head"><h2>Süreç</h2></div><div class="panel-body">
        <div class="timeline">
          <div class="tl-item done"><div class="tl-t">Talep oluşturuldu</div><div class="tl-d">${dtt(x.createdAt)}</div></div>
          <div class="tl-item ${x.teklifler.length?'done':'active'}"><div class="tl-t">Fiyatlar toplandı</div><div class="tl-d">${x.teklifler.length} teklif girildi</div></div>
          <div class="tl-item ${x.durum==='onayda'?'active':(x.durum==='onaylandi'||x.durum==='reddedildi'?'done':'')}"><div class="tl-t">Onaya gönderildi</div><div class="tl-d">${x.onay&&x.onay.gonderim?dtt(x.onay.gonderim):'—'}</div></div>
          <div class="tl-item ${x.durum==='onaylandi'?'done':(x.durum==='reddedildi'?'reject':'')}"><div class="tl-t">${x.durum==='reddedildi'?'Reddedildi':'Yönetim onayı'}</div><div class="tl-d">${x.onay&&x.onay.tarih?dtt(x.onay.tarih)+(x.onay.yonetici?' · '+esc(x.onay.yonetici):''):'bekleniyor'}</div></div>
          <div class="tl-item ${x.onay&&x.onay.imzaliBelge?'done':''}"><div class="tl-t">Islak imzalı belge</div><div class="tl-d">${x.onay&&x.onay.imzaliBelge?'arşivlendi':'—'}</div></div>
        </div>
      </div></div>

      ${x.onay&&(x.onay.not||x.onay.imzaliBelge)?`<div class="panel"><div class="panel-head"><h2>Onay kaydı</h2></div><div class="panel-body">
        ${x.onay.yonetici?`<div class="info-row"><div class="il">Onaylayan</div><div class="iv">${esc(x.onay.yonetici)}</div></div>`:''}
        ${x.onay.not?`<div class="info-row" style="flex-direction:column;align-items:flex-start"><div class="il">Not</div><div class="iv" style="font-weight:400;margin-top:4px">${esc(x.onay.not)}</div></div>`:''}
        ${x.onay.imzaliBelge?`<div class="file-chip" style="cursor:pointer" onclick="openFile('${x.id}')"><div class="fi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div><div style="flex:1"><div class="fn">${esc(x.onay.imzaliBelge.ad)}</div><div class="fs">Islak imzalı · görüntülemek için tıklayın</div></div></div>`:(x.durum==='onaylandi'?`<button class="btn sm" style="margin-top:8px" onclick="openOnayModal('${x.id}')">+ Islak imzalı belge ekle</button>`:'')}
      </div></div>`:''}
    </div>
  </div>`;
}

/* ---------- ONAY MERKEZI ---------- */
function viewOnaylar(){
  const onayda=DB.talepler.filter(x=>x.durum==='onayda');
  const gecmis=DB.talepler.filter(x=>x.durum==='onaylandi'||x.durum==='reddedildi').sort((a,b)=>new Date((b.onay&&b.onay.tarih)||0)-new Date((a.onay&&a.onay.tarih)||0));
  const nSel=bulkCount();
  return `
  <div class="panel"><div class="panel-head"><h2>Onay bekleyen talepler</h2><div class="spacer"></div>
    <div id="bulkBar" style="display:${nSel?'flex':'none'};align-items:center;gap:9px;margin-right:10px">
      <span class="tag" style="background:var(--navy);color:#fff;border-color:var(--navy)"><b id="bulkCount">${nSel}</b> seçili</span>
      <button class="btn sm ghost" onclick="clearBulk()">Temizle</button>
      <button class="btn sm primary" onclick="printCombinedReport()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>Toplu Onay Formu</button>
    </div>
    <span class="tag">${onayda.length} adet</span></div><div class="panel-body flush">
  ${onayda.length?`<table><thead><tr><th style="width:36px;text-align:center"><input type="checkbox" id="bulkAll" onclick="toggleBulkAll(this.checked)" ${nSel&&nSel===onayda.length?'checked':''}></th><th>Talep No</th><th>Güzergah</th><th>Önerilen Firma</th><th>Toplam Tutar</th><th>Teklif</th><th>Gönderim</th><th></th></tr></thead><tbody>
  ${onayda.map(x=>{const q=x.teklifler.find(q=>q.id===x.secilenTeklifId)||x.teklifler.find(q=>q.id===bestQuoteId(x));return `<tr class="t-row-click" onclick="go('detail','${x.id}')">
    <td style="text-align:center" onclick="event.stopPropagation()"><input type="checkbox" onclick="toggleBulk('${x.id}',this.checked)" ${bulkSel.has(x.id)?'checked':''}></td>
    <td class="cell-strong">${esc(x.talepNo)}</td>
    <td>${esc(x.yuklemeNoktasi)} → ${esc(x.teslimNoktasi)}</td>
    <td>${q?esc(firmName(q.firmaId)):'—'}</td>
    <td class="cell-strong">${q?money(qTotal(q,x),'TRY'):'—'}</td>
    <td><span class="tag">${x.teklifler.length} teklif</span></td>
    <td>${x.onay&&x.onay.gonderim?dt(x.onay.gonderim):'—'}</td>
    <td style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn sm" onclick="event.stopPropagation();printReport('${x.id}')">Rapor</button>
      <button class="btn sm primary" onclick="event.stopPropagation();openOnayModal('${x.id}')">Revize / Seç & Onay</button></td></tr>`}).join('')}
  </tbody></table>
  <div style="padding:10px 16px;font-size:12px;color:var(--faint);border-top:1px solid var(--line-2)">Birden fazla talebi seçip <b>Toplu Onay Formu</b> ile tek sayfada, kaşe & imza alanıyla yazdırabilirsiniz.</div>`:`<div class="empty" style="padding:40px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><h3>Onay sırası boş</h3><p>Talep detayından "Onaya Gönder" dediğinizde buraya düşer.</p></div>`}
  </div></div>

  <div class="panel"><div class="panel-head"><h2>Onay geçmişi & ıslak imza arşivi</h2></div><div class="panel-body flush">
  ${gecmis.length?`<table><thead><tr><th>Talep No</th><th>Güzergah</th><th>Firma</th><th>Tutar</th><th>Karar</th><th>Onaylayan</th><th>Tarih</th><th>Belge</th></tr></thead><tbody>
  ${gecmis.map(x=>{const q=x.teklifler.find(q=>q.id===x.secilenTeklifId);return `<tr class="t-row-click" onclick="go('detail','${x.id}')">
    <td class="cell-strong">${esc(x.talepNo)}</td>
    <td>${esc(x.yuklemeNoktasi)} → ${esc(x.teslimNoktasi)}</td>
    <td>${q?esc(firmName(q.firmaId)):'—'}</td>
    <td class="cell-strong">${q?money(q.fiyat,q.paraBirimi):'—'}</td>
    <td>${statusBadge(x.durum)}</td>
    <td>${x.onay&&x.onay.yonetici?esc(x.onay.yonetici):'—'}</td>
    <td>${x.onay&&x.onay.tarih?dt(x.onay.tarih):'—'}</td>
    <td>${x.onay&&x.onay.imzaliBelge?`<button class="btn sm ghost" onclick="event.stopPropagation();openFile('${x.id}')">📎 Göster</button>`:'<span style="color:var(--faint)">—</span>'}</td></tr>`}).join('')}
  </tbody></table>`:`<div class="empty" style="padding:34px"><p>Henüz onaylanmış / reddedilmiş talep yok.</p></div>`}
  </div></div>`;
}

/* ---------- FIRMALAR ---------- */
function viewFirmalar(){
  const q=document.getElementById('globalSearch').value.toLowerCase().trim();
  let list=[...DB.firmalar].sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
  if(q)list=list.filter(f=>(f.ad+(f.sehir||'')+(f.calisanlar||[]).map(c=>c.ad+c.email).join('')).toLowerCase().includes(q));
  if(!DB.firmalar.length)return `<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h.01M9 12h.01M9 16h.01M13 8h4M13 12h4M13 16h4"/></svg><h3>Firma kaydı yok</h3><p>Çalıştığınız nakliyecilerin firma kartlarını oluşturun: iletişim kişileri, e-posta ve telefonları burada saklanır, teklif eklerken listeden seçersiniz.</p><button class="btn primary" onclick="openFirmaModal()">+ İlk Firmayı Ekle</button></div>`;
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn sm" onclick="exportTumFiyatlar()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Tüm Fiyat Listesi (Excel)</button></div>
  <div class="firm-grid">${list.map(f=>{
    const teklifSay=DB.talepler.reduce((s,t)=>s+t.teklifler.filter(q=>q.firmaId===f.id).length,0);
    const secilme=DB.talepler.filter(t=>{const q=t.teklifler.find(q=>q.id===t.secilenTeklifId);return q&&q.firmaId===f.id}).length;
    return `<div class="firm-card" onclick="goFirma('${f.id}')" style="cursor:pointer">
      <div class="fc-head"><div class="fc-avatar">${initials(f.ad)}</div><div style="flex:1"><div class="fc-name">${esc(f.ad)}</div><div class="fc-meta">${esc(f.sehir||'')}${f.vergiNo?' · VKN '+esc(f.vergiNo):''}</div></div>
        <button class="btn sm ghost" style="color:#cfe0f0" onclick="event.stopPropagation();openFirmaModal('${f.id}')">✎</button></div>
      <div class="fc-body">

function delFirmaFromDetail(id){if(!confirm('Firma silinsin mi?'))return;DB.firmalar=DB.firmalar.filter(f=>f.id!==id);save();go('firmalar');toast('Firma silindi')}

      <div class="field"><label>Para Birimi</label><select id="an_para">${Object.keys(PARA).map(p=>`<option ${a&&a.paraBirimi===p?'selected':(!a&&p==='TRY'?'selected':'')}>${p}</option>`).join('')}</select></div>
    </div>

function saveAnlasma(firmaId,anlId){
  const f=DB.firmalar.find(x=>x.id===firmaId);if(!f)return;
  if(!Array.isArray(f.anlasmalar))f.anlasmalar=[];
  const urun=document.getElementById('an_urun').value;
  const yuk=document.getElementById('an_yuk').value;
  const tes=document.getElementById('an_tes').value;
  const fiyat=Number(document.getElementById('an_fiyat').value)||0;
  const para=document.getElementById('an_para').value;
  const tarih=document.getElementById('an_tarih').value;
  if(!yuk||!tes){toast('Yükleme ve teslim noktası seçin','err');return}
  if(fiyat<=0){toast('Geçerli bir birim fiyat girin','err');return}
  const dup=f.anlasmalar.find(x=>x.id!==anlId&&x.yuklemeLokasyonId===yuk&&x.teslimLokasyonId===tes&&(x.yukTipi||'')===(urun||''));
  if(dup){toast('Bunun için zaten bir fiyat var: '+(urun||'Tüm ürünler')+' · '+(lokName(yuk)||'')+' → '+(lokName(tes)||'')+' = '+money(dup.birimFiyat,dup.paraBirimi)+'/ton. Mevcut kaydı düzenleyin.','err');return}
  if(anlId){
    const a=f.anlasmalar.find(x=>x.id===anlId);if(!a)return;
    const degisti=(Number(a.birimFiyat)||0)!==fiyat||a.paraBirimi!==para;
    if(degisti){a.gecmis=Array.isArray(a.gecmis)?a.gecmis:[];a.gecmis.push({birimFiyat:Number(a.birimFiyat)||0,paraBirimi:a.paraBirimi||'TRY',tarih:a.tarih||''})}
    a.yuklemeLokasyonId=yuk;a.teslimLokasyonId=tes;a.yukTipi=urun||'';a.birimFiyat=fiyat;a.paraBirimi=para;a.tarih=tarih;
    toast(degisti?'Fiyat güncellendi, eskisi geçmişe eklendi':'Anlaşma güncellendi','ok');
  }else{
    f.anlasmalar.push({id:uid('a'),yuklemeLokasyonId:yuk,teslimLokasyonId:tes,yukTipi:urun||'',birimFiyat:fiyat,paraBirimi:para,tarih:tarih,gecmis:[]});
    toast('Anlaşmalı fiyat eklendi','ok');
  }
  save();closeModal();render();
}
function delAnlasma(firmaId,anlId){const f=DB.firmalar.find(x=>x.id===firmaId);if(!f)return;if(!confirm('Bu anlaşmalı fiyat (ve geçmişi) silinsin mi?'))return;f.anlasmalar=(f.anlasmalar||[]).filter(x=>x.id!==anlId);save();render();toast('Anlaşma silindi')}
function xlsDownload(filename,tableHtml){
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>'+tableHtml+'</body></html>';
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function anlExcelRows(f){
  return (f.anlasmalar||[]).map(a=>{

    return `<tr><td>${esc(f.ad)}</td><td>${esc(a.yukTipi||'Tüm ürünler')}</td><td>${esc(lokName(a.yuklemeLokasyonId)||'')}</td><td>${esc(lokName(a.teslimLokasyonId)||'')}</td><td style="mso-number-format:'\\#\\,\\#\\#0';">${Number(a.birimFiyat)||0}</td><td>${esc(a.paraBirimi||'TRY')}</td><td>${a.tarih?dt(a.tarih):''}</td><td>${esc(gec)}</td></tr>`;
  }).join('');
}

        ${l.email?`<div class="fc-line"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></div>`:''}

function lokRenk(l){return l.fabrika?'#c9a227':(TIP_RENK[l.tip]||'#1d4d7e')}
function lokTipOf(l){return l.fabrika?'Fabrika':(l.tip||'Diğer')}

  </div>

  <div class="map-wrap"><div id="mapMain"></div></div>`;

function initMainMap(){
  const el=document.getElementById('mapMain');if(!el)return;
  if(typeof L==='undefined'){el.parentElement.innerHTML='<div class="empty" style="padding:60px"><h3>Harita yüklenemedi</h3><p>Harita için internet bağlantısı gerekir (OpenStreetMap). Bağlantıyı kontrol edip sayfayı yenileyin.</p></div>';return}
  if(mainMap){mainMap.remove();mainMap=null}
  mainMap=L.map(el,{scrollWheelZoom:true}).setView([39.0,35.2],5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mainMap);
  const pts=[];
  DB.lokasyonlar.filter(l=>hasCoord(l)&&(state.haritaFilter==='all'||lokTipOf(l)===state.haritaFilter)).forEach(l=>{
    const m=L.circleMarker([l.lat,l.lng],{radius:9,color:'#fff',weight:2,fillColor:lokRenk(l),fillOpacity:1}).addTo(mainMap);
    const s=l.fabrika?'':(()=>{const st=lokasyonStats(l.id);return st.fiyatli?`<br><b>Fabrikaya ort:</b> ${money(st.avg,'TRY')} · ${st.sefer} sefer`:''})();
    m.bindPopup(`<b>${esc(l.ad)}</b>${l.fabrika?' ★':''}<br>${esc([l.ilce,l.il].filter(Boolean).join(' / ')||l.sehir||'')}${l.tip?' · '+esc(l.tip):''}${s}`);
    pts.push([l.lat,l.lng]);
  });
  if(pts.length)mainMap.fitBounds(pts,{padding:[50,50],maxZoom:12});
  setTimeout(()=>mainMap&&mainMap.invalidateSize(),120);
}

/* ---------- DENİZ NAVLUN ---------- */
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYLAR_K=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function navlunYillar(){const ys=[...new Set(DB.denizNavlun.map(r=>+(r.donem||'').slice(0,4)).filter(Boolean))];const cy=new Date().getFullYear();if(!ys.includes(cy))ys.push(cy);return ys.sort((a,b)=>b-a)}
function navlunHatlar(){return [...new Set(DB.denizNavlun.map(r=>(r.hat||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'))}
function navlunFiltered(yil,hat){return DB.denizNavlun.filter(r=>{if(+(r.donem||'').slice(0,4)!==yil)return false;if(hat&&hat!=='__all'&&(r.hat||'').trim()!==hat)return false;return true})}
function navlunAyData(yil,hat){
  const months=Array.from({length:12},()=>({c20:[],c40:[],recs:[]}));
  navlunFiltered(yil,hat).forEach(r=>{const m=+(r.donem||'').slice(5,7)-1;if(m<0||m>11)return;if(r.c20!=null&&r.c20!==''&&isFinite(+r.c20))months[m].c20.push(+r.c20);if(r.c40!=null&&r.c40!==''&&isFinite(+r.c40))months[m].c40.push(+r.c40);months[m].recs.push(r)});
  return months.map(o=>({c20:o.c20.length?o.c20.reduce((a,b)=>a+b,0)/o.c20.length:null,c40:o.c40.length?o.c40.reduce((a,b)=>a+b,0)/o.c40.length:null,count:o.recs.length}));
}
function dominantCur(recs){const c={};recs.forEach(r=>{const k=r.paraBirimi||'USD';c[k]=(c[k]||0)+1});let best='USD',n=-1;Object.keys(c).forEach(k=>{if(c[k]>n){n=c[k];best=k}});return best}
function navlunDelta(cur,prev){if(cur==null||prev==null||prev===0)return null;return (cur-prev)/prev*100}
function deltaHtml(d){if(d==null)return '<span style="color:var(--faint)">—</span>';const up=d>0,flat=Math.abs(d)<0.05;if(flat)return '<span style="color:var(--faint)">0%</span>';return `<span style="color:${up?'var(--red)':'var(--green)'};font-weight:600;font-size:12px">${up?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</span>`}

function viewDenizNavlun(){
  if(!DB.denizNavlun.length){
    return `<div class="empty" style="padding:60px 24px">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--navy-3);opacity:.5"><path d="M2 20a6 6 0 0 0 10 0 6 6 0 0 0 10 0"/><path d="M4 18l-2-6h20l-2 6"/><path d="M12 12V4M8 6h8"/></svg>
      <h3 style="margin-top:14px">Henüz deniz navlun kaydı yok</h3>
      <p>Her ayın 15'inde aldığınız <b>20′</b> ve <b>40′</b> konteyner navlunlarını buraya girin; sistem aylık ve yıllık olarak takip etsin.</p>
      <button class="btn primary" style="margin-top:14px" onclick="openNavlunModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>İlk Navlun Kaydını Ekle</button>
    </div>`;
  }
  const yil=state.navlunYil,hat=state.navlunHat;
  const yillar=navlunYillar(),hatlar=navlunHatlar();
  const filtered=navlunFiltered(yil,hat);
  const cur=dominantCur(filtered.length?filtered:DB.denizNavlun);
  const months=navlunAyData(yil,hat);
  const v20=months.map(m=>m.c20).filter(v=>v!=null), v40=months.map(m=>m.c40).filter(v=>v!=null);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const lastRec=[...filtered].sort((a,b)=>(b.donem||'').localeCompare(a.donem||'')||new Date(b.createdAt)-new Date(a.createdAt))[0];

  // pivot satırları
  let prev20=null,prev40=null;
  const rows=months.map((m,i)=>{
    const d20=navlunDelta(m.c20,prev20),d40=navlunDelta(m.c40,prev40);
    if(m.c20!=null)prev20=m.c20; if(m.c40!=null)prev40=m.c40;
    const bos=m.c20==null&&m.c40==null;
    return `<tr ${bos?'style="opacity:.45"':''}>
      <td class="cell-strong">${AYLAR[i]}</td>
      <td style="text-align:right">${m.c20!=null?money(m.c20,cur):'—'}</td>
      <td>${deltaHtml(d20)}</td>
      <td style="text-align:right">${m.c40!=null?money(m.c40,cur):'—'}</td>
      <td>${deltaHtml(d40)}</td>
      <td style="text-align:center">${m.count?`<span class="tag">${m.count}</span>`:''}</td>
    </tr>`;
  }).join('');

  // kayıt listesi
  const recList=[...filtered].sort((a,b)=>(b.donem||'').localeCompare(a.donem||'')).map(r=>`<tr>
    <td class="cell-strong">${esc(donemLabel(r.donem))}</td>
    <td>${esc(r.hat||'—')}</td>
    <td>${esc(r.tasiyici||'—')}</td>
    <td style="text-align:right">${r.c20!=null?money(r.c20,r.paraBirimi||'USD'):'—'}</td>
    <td style="text-align:right">${r.c40!=null?money(r.c40,r.paraBirimi||'USD'):'—'}</td>
    <td>${r.notlar?esc(r.notlar):''}</td>
    <td style="white-space:nowrap"><button class="btn sm ghost" onclick="openNavlunModal('${r.id}')">✎</button> <button class="btn sm ghost" style="color:var(--red)" onclick="delNavlun('${r.id}')">×</button></td>
  </tr>`).join('');

  return `
  <div class="filter-bar" style="margin-bottom:18px">
    <div class="field" style="margin-bottom:0;min-width:120px"><label style="font-size:11px">Yıl</label>
      <select onchange="state.navlunYil=+this.value;render()">${yillar.map(y=>`<option ${y===yil?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="field" style="margin-bottom:0;min-width:200px"><label style="font-size:11px">Hat / Güzergah</label>
      <select onchange="state.navlunHat=this.value;render()"><option value="__all" ${hat==='__all'?'selected':''}>Tümü (ortalama)</option>${hatlar.map(h=>`<option ${hat===h?'selected':''}>${esc(h)}</option>`).join('')}</select></div>
    <div style="flex:1"></div>
    <button class="btn primary" onclick="openNavlunModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Yeni Navlun Kaydı</button>
  </div>

  <div class="stat-grid" style="margin-bottom:20px">
    <div class="stat s1"><div class="k">20′ Ortalama (${yil})</div><div class="v" style="font-size:23px">${avg(v20)!=null?money(avg(v20),cur):'—'}</div><div class="d">${v20.length} aylık veri</div></div>
    <div class="stat s4"><div class="k">40′ Ortalama (${yil})</div><div class="v" style="font-size:23px;color:var(--gold)">${avg(v40)!=null?money(avg(v40),cur):'—'}</div><div class="d">${v40.length} aylık veri</div></div>
    <div class="stat s3"><div class="k">20′ Aralık (${yil})</div><div class="v" style="font-size:17px">${v20.length?money(Math.min(...v20),cur)+' – '+money(Math.max(...v20),cur):'—'}</div><div class="d">en düşük – en yüksek</div></div>
    <div class="stat s2"><div class="k">Son Kayıt</div><div class="v" style="font-size:17px">${lastRec?money(lastRec.c40!=null?lastRec.c40:lastRec.c20,lastRec.paraBirimi||'USD'):'—'}</div><div class="d">${lastRec?esc(donemLabel(lastRec.donem))+(lastRec.hat?' · '+esc(lastRec.hat):''):'—'}</div></div>
  </div>

  <div class="panel" style="margin-bottom:20px"><div class="panel-head"><h2>${yil} Yıllık Seyir ${hat!=='__all'?'· '+esc(hat):''}</h2><div class="spacer"></div><span style="font-size:12px;color:var(--faint)">Para birimi: ${cur}</span></div>
    <div class="panel-body">${navlunChart(months,cur)}</div></div>

  <div class="panel" style="margin-bottom:20px"><div class="panel-head"><h2>Aylık Tablo (${yil})</h2><div class="spacer"></div><span style="font-size:12px;color:var(--faint)">Δ = bir önceki veriye göre değişim</span></div>
    <div class="panel-body flush">

function navlunChart(months,cur){
  const W=720,H=240,pl=58,pr=18,pt=18,pb=30;
  const vals=[];months.forEach(m=>{if(m.c20!=null)vals.push(m.c20);if(m.c40!=null)vals.push(m.c40)});
  if(!vals.length)return '<div class="empty" style="padding:30px">Bu yıl için grafik verisi yok.</div>';
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn=mn*0.9;mx=mx*1.1||1}
  const pad=(mx-mn)*0.12;mn=Math.max(0,mn-pad);mx=mx+pad;
  const x=i=>pl+(W-pl-pr)*(i/11);
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  // y gridlines
  let grid='',labels='';
  for(let g=0;g<=4;g++){const val=mn+(mx-mn)*g/4;const yy=y(val);grid+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;labels+=`<text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--faint)">${Math.round(val).toLocaleString('tr-TR')}</text>`;}
  let xlab='';for(let i=0;i<12;i++)xlab+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--faint)">${AYLAR_K[i]}</text>`;
  const series=(key,color)=>{
    const pts=[];months.forEach((m,i)=>{if(m[key]!=null)pts.push([x(i),y(m[key]),i,m[key]])});
    if(!pts.length)return '';
    const path=pts.map((p,j)=>(j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"><title>${AYLAR[p[2]]}: ${money(p[3],cur)}</title></circle>`).join('');
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}`;
  };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:300px;font-family:var(--ff)">
    ${grid}${labels}${xlab}
    ${series('c20','var(--navy-3)')}
    ${series('c40','var(--gold)')}
    <g transform="translate(${pl},${pt-4})">
      <rect x="0" y="-2" width="13" height="13" rx="2" fill="var(--navy-3)"/><text x="18" y="9" font-size="12" fill="var(--muted)">20′</text>
      <rect x="56" y="-2" width="13" height="13" rx="2" fill="var(--gold)"/><text x="74" y="9" font-size="12" fill="var(--muted)">40′</text>
    </g>
  </svg>`;
}

function saveNavlun(id){
  const donem=document.getElementById('n_donem').value;

  const data={donem,tarih:donem+'-15',hat:document.getElementById('n_hat').value.trim(),tasiyici:document.getElementById('n_tasiyici').value.trim(),c20:c20?Number(c20):null,c40:c40?Number(c40):null,paraBirimi:document.getElementById('n_para').value,notlar:document.getElementById('n_not').value.trim()};
  if(id){Object.assign(DB.denizNavlun.find(x=>x.id===id),data);toast('Navlun kaydı güncellendi','ok')}

/* ---------- ANALIZ ---------- */
function viewAnaliz(){
  // güzergah bazlı
  const routes={};
  DB.talepler.forEach(t=>{const k=t.yuklemeNoktasi+' → '+t.teslimNoktasi;if(!routes[k])routes[k]={count:0,prices:[]};routes[k].count++;const q=t.teklifler.find(q=>q.id===t.secilenTeklifId)||t.teklifler.find(q=>q.id===bestQuoteId(t));if(q)routes[k].prices.push(toTRY(q.fiyat,q.paraBirimi))});
  const rkeys=Object.keys(routes).sort((a,b)=>routes[b].count-routes[a].count);
  // firma performans
  const firms=DB.firmalar.map(f=>{const qs=[];DB.talepler.forEach(t=>t.teklifler.filter(q=>q.firmaId===f.id).forEach(q=>qs.push(toTRY(q.fiyat,q.paraBirimi))));const sec=DB.talepler.filter(t=>{const q=t.teklifler.find(q=>q.id===t.secilenTeklifId);return q&&q.firmaId===f.id}).length;return{ad:f.ad,teklif:qs.length,sec,avg:qs.length?qs.reduce((a,b)=>a+b,0)/qs.length:0}}).filter(f=>f.teklif>0).sort((a,b)=>b.teklif-a.teklif);

  return `
  <div class="panel"><div class="panel-head"><h2>Güzergah fiyat geçmişi</h2><div class="spacer"></div><span class="tag">TRY karşılığı</span></div><div class="panel-body flush">
  ${rkeys.length?`<table><thead><tr><th>Güzergah</th><th>Talep</th><th>En Düşük</th><th>Ortalama</th><th>En Yüksek</th></tr></thead><tbody>
  ${rkeys.map(k=>{const r=routes[k];const p=r.prices;return `<tr><td class="cell-strong">${esc(k)}</td><td><span class="tag">${r.count}</span></td>
    <td>${p.length?money(Math.min(...p),'TRY'):'—'}</td>
    <td class="cell-strong">${p.length?money(p.reduce((a,b)=>a+b,0)/p.length,'TRY'):'—'}</td>
    <td>${p.length?money(Math.max(...p),'TRY'):'—'}</td></tr>`}).join('')}
  </tbody></table>`:`<div class="empty" style="padding:34px"><p>Veri biriktikçe aynı güzergahın geçmiş fiyatları burada karşılaştırılır.</p></div>`}
  </div></div>

  <div class="panel"><div class="panel-head"><h2>Firma performansı</h2></div><div class="panel-body flush">
  ${firms.length?`<table><thead><tr><th>Firma</th><th>Verdiği Teklif</th><th>Seçildi/Onaylandı</th><th>Kazanma Oranı</th><th>Ort. Teklif (TRY)</th></tr></thead><tbody>
  ${firms.map(f=>`<tr><td class="cell-strong">${esc(f.ad)}</td><td>${f.teklif}</td><td>${f.sec}</td>
    <td>${f.teklif?`<b style="color:var(--green)">%${Math.round(f.sec/f.teklif*100)}</b>`:'—'}</td>
    <td>${money(f.avg,'TRY')}</td></tr>`).join('')}
  </tbody></table>`:`<div class="empty" style="padding:34px"><p>Firmalar teklif verdikçe performansları burada görünür.</p></div>`}
  </div></div>

  <div class="panel"><div class="panel-head"><h2>Döviz kurları</h2><div class="spacer"></div><button class="btn sm" onclick="openKurModal()">Kurları Güncelle</button></div><div class="panel-body">
    <div style="display:flex;gap:24px;flex-wrap:wrap">
      <div><div style="font-size:12px;color:var(--muted)">USD/TRY</div><div style="font-size:22px;font-weight:800">${fmt(DB.kur.USD)}</div></div>
      <div><div style="font-size:12px;color:var(--muted)">EUR/TRY</div><div style="font-size:22px;font-weight:800">${fmt(DB.kur.EUR)}</div></div>
    </div>
    <p style="font-size:12.5px;color:var(--faint);margin-top:12px">Karşılaştırmalarda farklı para birimindeki teklifler bu kurla TRY'ye çevrilir. Manuel güncellersiniz.</p>
  </div></div>`;
}

function yukTipiSelChange(){const s=document.getElementById('f_yuktip_sel');const o=document.getElementById('f_yuktip_other');if(!s||!o)return;const show=s.value==='__other';o.style.display=show?'block':'none';if(show)o.focus()}
function saveTalep(id){
  const g=i=>document.getElementById(i).value.trim();
  const yukId=document.getElementById('f_yuk').value,tesId=document.getElementById('f_tes').value;
  if(!yukId||!tesId){toast('Yükleme ve teslim lokasyonu seçin','err');return}
  const yL=DB.lokasyonlar.find(l=>l.id===yukId),tL=DB.lokasyonlar.find(l=>l.id===tesId);
  const ysel=document.getElementById('f_yuktip_sel').value;
  let yukTipi=(ysel==='__other')?document.getElementById('f_yuktip_other').value.trim():ysel;
  if(!yukTipi){toast('Yük tipini seçin','err');return}
  if(/^[\d.,\s]+$/.test(yukTipi)){toast('Yük tipi sadece sayı olamaz','err');return}
  const data={talepNo:g('f_no')||('NT-'+Date.now()),yuklemeLokasyonId:yukId,teslimLokasyonId:tesId,yuklemeNoktasi:yL?yL.ad:'',teslimNoktasi:tL?tL.ad:'',yukTipi:yukTipi,miktar:tonNum(document.getElementById('f_miktar').value),birim:document.getElementById('f_birim').value,aracTipi:document.getElementById('f_arac').value,yuklemeTarihi:g('f_tarih'),aciklama:g('f_aciklama')};
  if(id){const x=DB.talepler.find(t=>t.id===id);Object.assign(x,data);toast('Talep güncellendi','ok')}
  else{
    const yeni=Object.assign({id:uid('t'),teklifler:[],secilenTeklifId:null,durum:'toplama',onay:null,createdAt:new Date().toISOString()},data);
    findAnlasmalar(yukId,tesId,yukTipi).forEach(a=>{yeni.teklifler.push({id:uid('q'),firmaId:a.firma.id,fiyat:a.anlasma.birimFiyat,paraBirimi:a.anlasma.paraBirimi,kdvDahil:false,teslimSuresi:'',gecerlilik:plus7(),notlar:'Anlaşmalı fiyat (otomatik)',createdAt:new Date().toISOString()})});
    DB.talepler.push(yeni);
    toast(yeni.teklifler.length?('Talep oluşturuldu · '+yeni.teklifler.length+' anlaşmalı fiyat otomatik eklendi'):'Talep oluşturuldu — şimdi teklif ekleyin','ok');
  }
  save();closeModal();if(!id&&state.view!=='detail'){go('detail',DB.talepler[DB.talepler.length-1].id)}else render();
}

function reviseRecalc(id){
  const t=DB.talepler.find(x=>x.id===id);const tbl=document.getElementById('reviseTable');if(!tbl)return;
  let selId=null,selFirma='',selPara='TRY',selUnit=0;
  tbl.querySelectorAll('tbody tr[data-qid]').forEach(tr=>{
    const fiyat=parseFloat(tr.querySelector('.rv-fiyat').value)||0;
    const para=tr.querySelector('.rv-para').value;
    const tot=toTRY(fiyat,para)*(Number(t.miktar)||0);
    const cell=tr.querySelector('.rv-tot');if(cell)cell.textContent=t.miktar?money(tot,'TRY'):'—';
    const r=tr.querySelector('input[type=radio]');
    tr.style.background=r&&r.checked?'var(--gold-soft)':'';
    if(r&&r.checked){selId=tr.dataset.qid;selFirma=tr.children[1].textContent;selPara=para;selUnit=fiyat}
  });
  const sum=document.getElementById('o_selSummary');
  if(sum)sum.innerHTML=selId?`Seçilen: <b>${esc(selFirma)}</b> · <b>${money(selUnit,selPara)}/${esc(t.birim||'ton')}</b>${t.miktar?` · Toplam <b>${money(toTRY(selUnit,selPara)*(Number(t.miktar)||0),'TRY')}</b>`:''}`:'<span style="color:var(--amber)">Henüz teklif seçilmedi — bir satırı işaretleyin.</span>';
}
function collectRevise(id){
  const t=DB.talepler.find(x=>x.id===id);const tbl=document.getElementById('reviseTable');if(!tbl)return false;
  let sel=null;
  tbl.querySelectorAll('tbody tr[data-qid]').forEach(tr=>{
    const q=t.teklifler.find(x=>x.id===tr.dataset.qid);if(!q)return;
    const fiyat=parseFloat(tr.querySelector('.rv-fiyat').value);
    if(isFinite(fiyat)&&fiyat>0)q.fiyat=fiyat;
    q.paraBirimi=tr.querySelector('.rv-para').value;
    q.kdvDahil=tr.querySelector('.rv-kdv').value==='1';
    const r=tr.querySelector('input[type=radio]');if(r&&r.checked)sel=q.id;
  });
  if(sel)t.secilenTeklifId=sel;
  return true;
}

function empRow(e){e=e||{};return `<div class="emp-row"><input placeholder="Ad Soyad" value="${esc(e.ad||'')}" data-k="ad"><input placeholder="Ünvan" value="${esc(e.unvan||'')}" data-k="unvan"><input placeholder="E-posta" value="${esc(e.email||'')}" data-k="email"><input placeholder="${TEL_PH}" oninput="this.value=telFmt(this.value)" value="${esc(e.telefon||'')}" data-k="telefon"><button class="del" onclick="this.parentElement.remove()">×</button></div>`}
function anlRow(a){const isNew=!a;a=a||{};const tarih=(a.tarih!=null&&a.tarih!=='')?a.tarih:(isNew?new Date().toISOString().slice(0,10):'');return `<div class="anl-row" style="display:grid;grid-template-columns:0.75fr 1fr 1fr 0.6fr 0.5fr 0.85fr auto;gap:8px;margin-bottom:8px;align-items:center"><select data-k="yukTipi"><option value="">Tüm ürünler</option>${YUK_TIPLERI.map(y=>`<option ${a.yukTipi===y?'selected':''}>${esc(y)}</option>`).join('')}${a.yukTipi&&!YUK_TIPLERI.includes(a.yukTipi)?`<option selected>${esc(a.yukTipi)}</option>`:''}</select><select data-k="yuklemeLokasyonId">${locOptions(a.yuklemeLokasyonId||'')}</select><select data-k="teslimLokasyonId">${locOptions(a.teslimLokasyonId!=null&&a.teslimLokasyonId!==''?a.teslimLokasyonId:defaultTeslimId())}</select><input type="number" step="any" placeholder="₺/ton" value="${a.birimFiyat!=null?a.birimFiyat:''}" data-k="birimFiyat"><select data-k="paraBirimi">${Object.keys(PARA).map(p=>`<option ${a.paraBirimi===p?'selected':(!a.paraBirimi&&p==='TRY'?'selected':'')}>${p}</option>`).join('')}</select><input type="date" data-k="tarih" value="${tarih}" title="Anlaşma tarihi"><button class="del" onclick="this.parentElement.remove()">×</button></div>`}
function anlasmaGecmisiHtml(anls){
  const groups={};
  anls.forEach(a=>{if(a.birimFiyat==null||a.birimFiyat==='')return;const k=(a.yuklemeLokasyonId||'')+'|'+(a.teslimLokasyonId||'')+'|'+(a.yukTipi||'');(groups[k]=groups[k]||[]).push(a)});
  const keys=Object.keys(groups);
  if(!keys.length)return '';
  const blocks=keys.map(k=>{
    const rows=groups[k].slice().sort((x,y)=>(x.tarih||'').localeCompare(y.tarih||''));
    const a0=rows[0];
    const head=`${esc(lokName(a0.yuklemeLokasyonId)||'—')} → ${esc(lokName(a0.teslimLokasyonId)||'—')} · ${a0.yukTipi?esc(a0.yukTipi):'Tüm ürünler'}`;
    let prev=null;
    const trs=rows.map(a=>{const v=toTRY(a.birimFiyat,a.paraBirimi);let delta='<span style="color:var(--faint)">—</span>';if(prev!=null&&prev!==0){const d=(v-prev)/prev*100;delta=`<span style="color:${d>0?'var(--red)':(d<0?'var(--green)':'var(--faint)')};font-weight:600">${d>0?'▲':(d<0?'▼':'')} ${Math.abs(d).toFixed(1)}%</span>`}prev=v;return `<div style="display:grid;grid-template-columns:1fr auto 78px;gap:10px;padding:4px 0;font-size:12.5px;border-top:1px solid var(--line-2)"><span style="color:var(--muted)">${a.tarih?dt(a.tarih):'tarih yok'}</span><b>${money(a.birimFiyat,a.paraBirimi)}/ton</b><span style="text-align:right">${delta}</span></div>`}).join('');
    const first=toTRY(rows[0].birimFiyat,rows[0].paraBirimi),last=toTRY(rows[rows.length-1].birimFiyat,rows[rows.length-1].paraBirimi);
    const overall=first?((last-first)/first*100):0;
    const cur=rows[rows.length-1];
    return `<div style="border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px"><b style="font-size:12.5px">${head}</b>
        <span class="tag" style="background:var(--gold-soft);border-color:var(--gold);color:var(--amber)">Güncel: ${money(cur.birimFiyat,cur.paraBirimi)}/ton</span>
        ${rows.length>1?`<span style="font-size:11.5px;color:${overall>0?'var(--red)':(overall<0?'var(--green)':'var(--faint)')};font-weight:600">başlangıca göre ${overall>0?'+':''}${overall.toFixed(1)}%</span>`:''}</div>
      ${trs}</div>`;
  }).join('');
  return `<div style="margin-top:16px"><div style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:8px">Anlaşma Fiyat Geçmişi & Değişim</div>${blocks}</div>`;
}

function initModalMap(){
  const el=document.getElementById('mapModal');if(!el)return;
  if(typeof L==='undefined'){el.innerHTML='<div style="padding:20px;font-size:12.5px;color:var(--muted)">Harita için internet gerekir. Koddan/koordinattan giriş yine de çalışır.</div>';return}
  if(modalMap){modalMap.remove();modalMap=null;modalMarker=null}
  const c=modalLatLng||{lat:39.0,lng:35.2};
  modalMap=L.map(el,{scrollWheelZoom:true}).setView([c.lat,c.lng],modalLatLng?12:5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(modalMap);
  if(modalLatLng)setModalPin(modalLatLng.lat,modalLatLng.lng,false);
  modalMap.on('click',e=>setModalPin(e.latlng.lat,e.latlng.lng,false));
  setTimeout(()=>modalMap&&modalMap.invalidateSize(),120);
}
function setModalPin(lat,lng,center,noField){
  modalLatLng={lat,lng};
  if(!noField){const a=document.getElementById('l_lat'),b=document.getElementById('l_lng');if(a)a.value=(+lat).toFixed(6);if(b)b.value=(+lng).toFixed(6)}
  if(modalMap){if(modalMarker)modalMap.removeLayer(modalMarker);modalMarker=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:2,fillColor:'#c9a227',fillOpacity:1}).addTo(modalMap);if(center)modalMap.setView([lat,lng],13)}
}
function konumGuncelle(center){
  const la=parseFloat((document.getElementById('l_lat')||{}).value);
  const lo=parseFloat((document.getElementById('l_lng')||{}).value);
  if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180){setModalPin(la,lo,!!center,true);if(center)toast('Konum haritada gösterildi','ok')}
  else{modalLatLng=null;if(modalMap&&modalMarker){modalMap.removeLayer(modalMarker);modalMarker=null}if(center)toast('Geçerli enlem (-90..90) ve boylam (-180..180) girin','err')}
}

function toggleBulkAll(ck){const ids=DB.talepler.filter(x=>x.durum==='onayda').map(x=>x.id);if(ck)ids.forEach(i=>bulkSel.add(i));else ids.forEach(i=>bulkSel.delete(i));render()}

function updateBulkBar(){const n=bulkCount();const bar=document.getElementById('bulkBar');if(bar){bar.style.display=n?'flex':'none';const c=document.getElementById('bulkCount');if(c)c.textContent=n}const all=document.getElementById('bulkAll');if(all){const total=DB.talepler.filter(x=>x.durum==='onayda').length;all.checked=n>0&&n===total}}

function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.talepler||!d.firmalar)throw 0;if(!confirm('Mevcut veriler bu yedekle değiştirilecek. Devam edilsin mi?'))return;DB=Object.assign({firmalar:[],lokasyonlar:[],talepler:[],kur:{USD:34.5,EUR:37.2},meta:DB.meta},d);migrate();save();render();toast('Yedek geri yüklendi','ok')}catch(e){toast('Geçersiz yedek dosyası','err')}};r.readAsText(f);ev.target.value=''}

/* mevcut (eski) verisi olan kullanıcılar için: lokasyon yapısını garanti et */
function migrate(){
  if(!Array.isArray(DB.lokasyonlar))DB.lokasyonlar=[];
  if(!Array.isArray(DB.denizNavlun))DB.denizNavlun=[];
  if(!(DB.talepler.length||DB.firmalar.length||DB.lokasyonlar.length))return;
  let dirty=false;
  let fab=DB.lokasyonlar.find(l=>l.fabrika);
  if(!fab){fab={id:uid('l'),ad:'Sunar Mısır',sehir:'Adana',tip:'Fabrika',adres:'',iletisim:'',telefon:'',email:'',notlar:'Varsayılan teslim noktası',fabrika:true,createdAt:new Date().toISOString()};DB.lokasyonlar.unshift(fab);dirty=true}
  DB.talepler.forEach(t=>{
    if(!t.yuklemeLokasyonId&&t.yuklemeNoktasi){let l=DB.lokasyonlar.find(x=>x.ad.toLowerCase()===t.yuklemeNoktasi.toLowerCase());if(!l){l={id:uid('l'),ad:t.yuklemeNoktasi,sehir:'',tip:'Yükleme Noktası',adres:'',iletisim:'',telefon:'',email:'',notlar:'',fabrika:false,createdAt:new Date().toISOString()};DB.lokasyonlar.push(l)}t.yuklemeLokasyonId=l.id;dirty=true}
    if(!t.teslimLokasyonId&&t.teslimNoktasi){let l=DB.lokasyonlar.find(x=>x.ad.toLowerCase()===t.teslimNoktasi.toLowerCase());if(!l){l={id:uid('l'),ad:t.teslimNoktasi,sehir:'',tip:'Diğer',adres:'',iletisim:'',telefon:'',email:'',notlar:'',fabrika:false,createdAt:new Date().toISOString()};DB.lokasyonlar.push(l)}t.teslimLokasyonId=l.id;dirty=true}
  });
  // anlaşmaları v2'ye normalize et: (hat+ürün) başına tek güncel fiyat + gecmis[]
  DB.firmalar.forEach(f=>{
    if(!Array.isArray(f.anlasmalar)||!f.anlasmalar.length)return;
    if(f.anlasmalar.every(a=>a.gecmis!==undefined&&a.id))return; // zaten v2
    const groups={};
    f.anlasmalar.forEach(a=>{const k=(a.yuklemeLokasyonId||'')+'|'+(a.teslimLokasyonId||'')+'|'+(a.yukTipi||'');(groups[k]=groups[k]||[]).push(a)});
    const yeni=[];
    Object.values(groups).forEach(rows=>{
      rows.sort((x,y)=>(x.tarih||'').localeCompare(y.tarih||''));
      const cur=rows[rows.length-1];
      const gecmis=rows.slice(0,-1).map(r=>({birimFiyat:Number(r.birimFiyat)||0,paraBirimi:r.paraBirimi||'TRY',tarih:r.tarih||''})).concat(Array.isArray(cur.gecmis)?cur.gecmis:[]);
      yeni.push({id:cur.id||uid('a'),yuklemeLokasyonId:cur.yuklemeLokasyonId,teslimLokasyonId:cur.teslimLokasyonId,yukTipi:cur.yukTipi||'',birimFiyat:Number(cur.birimFiyat)||0,paraBirimi:cur.paraBirimi||'TRY',tarih:cur.tarih||'',gecmis});
    });
    f.anlasmalar=yeni;dirty=true;
  });
  if(dirty)save();
}
