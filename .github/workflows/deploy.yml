name: Build & Deploy (GitHub Pages)

# Her push'ta otomatik olarak güvenlik denetimi yapar, uygulamayı derler ve
# (GitHub Pages açıksa) yayına alır. Pages henüz açık değilse derleme yine de
# başarılı olur ve hazır site bir "artifact" olarak indirilebilir kalır.
on:
  push:
    branches:
      - main
      - claude/confident-babbage-ow7f7l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Güvenlik geçidi + derleme. Bu iş her zaman çalışır ve gerçek bir sorun
  # (güvenlik açığı, lint/tip hatası, derleme hatası) varsa kırmızıya döner.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (güvenlik geçidi)
        # Yüksek/kritik güvenlik açığı varsa derlemeyi ve dağıtımı durdurur.
        # --omit=dev: yalnızca CANLI SİTEYE GİDEN (dependencies) paketler
        # denetlenir. devDependencies (eslint, typescript vb.) derleme
        # çıktısına hiç girmez — statik export'a paketlenmez, kullanıcıya
        # ulaşmaz — bu yüzden onlardaki bir CVE deploy'u durdurmamalı. Canlıya
        # giden bağımlılıklarda (next, react, @supabase/…) yüksek/kritik bir
        # açık çıkarsa gate yine kırmızıya döner.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build (statik dışa aktarım)
        env:
          # GitHub Pages proje sitesi alt yolu. Kök alan adı / özel domain
          # kullanılırsa bu değeri boşaltın.
          PAGES_BASE_PATH: /lojistik-maliyet-takip-exceli
        run: npm run build

      - name: Disable Jekyll (_next klasörü için)
        run: touch out/.nojekyll

      - name: Upload site artifact (indirilebilir)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # GitHub Pages'e dağıtım. Pages henüz etkin değilse (örn. özel repo + ücretsiz
  # plan) bu iş başarısız olabilir; continue-on-error sayesinde CI yeşil kalır
  # ve Pages açılır açılmaz bir sonraki push otomatik olarak yayına alınır.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
